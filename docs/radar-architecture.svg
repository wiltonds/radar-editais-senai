  <text x="865" y="278" text-anchor="middle" fill="#b9c4d8" font-size="15">RAG context</text>

  <rect x="1060" y="150" width="270" height="150" rx="16" fill="#17213a" stroke="#a78bfa" stroke-width="2"/>
