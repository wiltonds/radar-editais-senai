  <text x="1015" y="470" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">Commercial Briefing</text>
  <text x="1015" y="502" text-anchor="middle" fill="#b9c4d8" font-size="15">Prioritized opportunities</text>
