<text x="70" y="670" fill="#ffffff" font-family="Arial, sans-serif" font-size="20" font-weight="700">Design principle</text>
<text x="70" y="704" fill="#aeb8cc" font-family="Arial, sans-serif" font-size="18">Evidence → Retrieval → AI reasoning → Validation → Prioritization → Decision support</text>
<text x="70" y="735" fill="#77839b" font-family="Arial, sans-serif" font-size="15">Portfolio architecture — public data and code only; sensitive production datasets remain outside the repository.</text>
</svg>