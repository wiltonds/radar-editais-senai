  <text x="515" y="278" text-anchor="middle" fill="#b9c4d8" font-size="15">Evidence filtering</text>

  <rect x="730" y="150" width="270" height="150" rx="16" fill="#17213a" stroke="#7dd3fc" stroke-width="2"/>
